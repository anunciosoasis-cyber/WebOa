server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Diapositivas y anuncios suben archivos grandes (hasta 150 MB por lote)
    client_max_body_size 160m;

    # ^~: los proxies ganan a la regla de caché por extensión (/uploads/*.png)
    # Proxy para API de NestJS
    location ^~ /api/ {
        proxy_pass http://api-web:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Gateway en tiempo real (Socket.IO, namespace /live): WebSocket de larga duración
    location ^~ /socket.io/ {
        proxy_pass http://api-web:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Archivos subidos en modo local (sin Cloudinary)
    location ^~ /uploads/ {
        proxy_pass http://api-web:3000/uploads/;
        expires 7d;
    }

    # Biblia e Himnario (AdventistMediaEngine, solo lectura)
    location ^~ /media/ {
        proxy_pass http://media-api:8080/;
        proxy_set_header Host $host;
    }

    # Cache de activos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
